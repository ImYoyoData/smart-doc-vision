root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  bin = "./tmp/server.exe"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "bin", "dist"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true
