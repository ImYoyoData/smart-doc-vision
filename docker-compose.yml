name: smartdoc-vision

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # 与后端 APP_TIMEZONE 保持一致；--default-time-zone=SYSTEM 让 MySQL 采用该时区。
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartdoc-change-me}
      MYSQL_DATABASE: smart-doc-vision
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=SYSTEM
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      # 时区与下方 MySQL/Redis 容器保持一致；日志、任务时间和报表按天统计都依赖它。
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      # 数据库：默认使用下方 MySQL 服务。改用 PostgreSQL 时设置
      # DB_DRIVER=postgres 与 DB_DSN=postgres://user:pass@host:5432/db?sslmode=disable，
      # 并停用/移除 mysql 服务。
      DB_DRIVER: ${DB_DRIVER:-}
      DB_DSN: ${DB_DSN:-}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-smartdoc-change-me}
      DB_NAME: ${DB_NAME:-smart-doc-vision}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 3
      JWT_SECRET: ${JWT_SECRET:-replace-this-jwt-secret-in-production}
      MASTER_KEY: ${MASTER_KEY:-replace-this-master-key-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://127.0.0.1:8088}
      WORKER_COUNT: ${WORKER_COUNT:-4}
      MEDIA_ALLOW_PRIVATE: "false"
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/data/uploads}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_S3_PROVIDER: ${STORAGE_S3_PROVIDER:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
    volumes:
      # Uploaded files must survive container recreation; do not remove this.
      - app-data:/app/data
      # Request and error logs live under /app/logs by default.
      - logs-data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  app-data:
  logs-data:
